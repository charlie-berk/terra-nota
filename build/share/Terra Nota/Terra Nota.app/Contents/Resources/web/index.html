<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terra Nota</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-been" viewBox="0 0 16 16"><path d="M3.2 8.6 6.5 11.8 12.9 4.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-lived" viewBox="0 0 16 16"><path d="M2.6 7.6 8 3l5.4 4.6M4.3 6.6v6.1h7.4V6.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m10.4 10.4 3.2 3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 16 16"><path d="m6 3.5 4.5 4.5L6 12.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-world" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2.6 8h10.8M8 2.4c-3.6 3.4-3.6 7.8 0 11.2 3.6-3.4 3.6-7.8 0-11.2Z" fill="none" stroke="currentColor" stroke-width="1.3"/></symbol>
</svg>

<aside id="panel" aria-label="Your travels">
  <header id="brand"><span>Terra Nota</span></header>

  <section id="overview">
    <div id="score"></div>
    <label class="search">
      <svg aria-hidden="true"><use href="#i-search"/></svg>
      <input id="q" type="search" placeholder="Find a country or state" autocomplete="off" spellcheck="false" aria-label="Find a country or state">
    </label>
    <div id="lists"></div>
  </section>

  <section id="sheet" hidden></section>

  <footer id="foot">
    <span>Saved automatically</span>
    <span class="links">
      <button data-act="export">Export</button>
      <button data-act="import">Import</button>
      <button data-act="reveal" id="reveal" hidden>Show file</button>
    </span>
  </footer>
</aside>

<main id="stage">
  <canvas id="map" aria-label="World map. Use the list on the left to reach the same places by keyboard."></canvas>

  <div id="zoom" role="group" aria-label="Map zoom">
    <button data-act="zoom-in" aria-label="Zoom in" title="Zoom in">+</button>
    <button data-act="zoom-out" aria-label="Zoom out" title="Zoom out">−</button>
    <button data-act="home" aria-label="Whole world" title="Whole world"><svg aria-hidden="true"><use href="#i-world"/></svg></button>
  </div>

  <div id="legend" aria-hidden="true">
    <span><i class="sw been"></i>Been</span>
    <span><i class="sw lived"></i>Lived</span>
  </div>

  <p id="hint">Click any country to begin.</p>
  <div id="tip" hidden></div>
  <div id="card" hidden role="dialog" aria-label="Mark this place"></div>
  <div id="toast" hidden role="status"></div>
</main>

<input id="file" type="file" accept="application/json,.json" hidden>
<script src="data/world.js"></script>
<script src="data/states.js"></script>
<script src="app.js"></script>
</body>
</html>
